services:
  agent-space:
    build: .
    ports:
      - "8787:8787"
    environment:
      # 三个都留空时，容器以演示模式启动。
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_LIGHT_NAME: ${MODEL_LIGHT_NAME:-}
      LIGHT_MODE: ${LIGHT_MODE:-}
      DEMO_MODE: ${DEMO_MODE:-}
      # 旧变量仍传入。只配置了 DEEPSEEK_API_KEY 的部署不用改。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DSH_MODEL: ${DSH_MODEL:-}
      DSH_PROVIDER: ${DSH_PROVIDER:-}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-to-a-long-random-string}
      ACCESS_CODE: ${ACCESS_CODE:-}
    volumes:
      - agent-space-data:/data
    restart: unless-stopped

volumes:
  agent-space-data:
